# Local topology for integration, e2e and chaos suites (ADR-0009).
# These containers are stand-ins, not AWS. Emulator behaviour is never treated as
# evidence about AWS semantics.
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb", "-port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      # DynamoDB Local answers unauthenticated requests with 400; a TCP-level answer is
      # what we need to know it is up.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo ok >&3"]
      interval: 2s
      timeout: 2s
      retries: 30

  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "9324:9324"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro
    # No healthcheck: the elasticmq-native image has no shell to run one with. The test
    # global setup polls the port directly instead.
