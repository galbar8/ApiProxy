# ElasticMQ stands in for SQS locally (ADR-0009).
# Queue names, redrive policy and maxReceiveCount mirror the CDK definitions so a local
# poison-message test exercises the same thresholds as production.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "workflow-start-dlq" {
    defaultVisibilityTimeout = 30 seconds
  }
  "workflow-step-dlq" {
    defaultVisibilityTimeout = 30 seconds
  }
  "workflow-start" {
    defaultVisibilityTimeout = 185 seconds
    deadLettersQueue {
      name = "workflow-start-dlq"
      maxReceiveCount = 5
    }
  }
  "workflow-step" {
    defaultVisibilityTimeout = 185 seconds
    deadLettersQueue {
      name = "workflow-step-dlq"
      maxReceiveCount = 5
    }
  }
}
